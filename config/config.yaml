# orcSONAR – Main Configuration
# Default: VEGFA / HeLa proof-of-concept run

# --- Analysis Target ---
target_gene: "VEGFA"
cell_line: "HeLa"
sarna_sequence: "GCAACCATAGCCTCGGCCGC"

# --- Promoter Window ---
promoter_upstream: 1000
promoter_downstream: 200

# --- Thermodynamic Thresholds ---
# delta_g_strong / delta_g_moderate were REMOVED 2026-11-27 (roadmap C3d).
# No literature supports a transportable per-site ΔG threshold, and the two
# values sat outside the range this pipeline can even produce. They are not
# retuned, because retuning a threshold to make a channel fire is what
# invariant 7 forbids. See src/stage5_biophysics/delta_g_calculator.py.

# --- Seed Alignment ---
seed_length: 7
# Counts all mismatches across the 20-nt anti-parallel alignment. miRNA-style
# off-targets show perfect 7-mer seed + extensive flanking mismatches — 12
# admits these canonical seed-only off-targets; the score (Watson-Crick +1,
# G:U wobble +0.5) drives ranking.
max_mismatches: 12
gc_range: [35, 65]         # % GC content acceptable range

# --- Remote Data URLs ---
phylop_bigwig_url: "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/phyloP100way/hg38.phyloP100way.bw"
# PINNED to an Ensembl archive host (roadmap B17). `rest.ensembl.org` is
# not a pin, it is "whatever is current", and that is what let the cache
# fill with two releases at once. A release only gets an archive host once
# it is superseded, so the rule is: the newest release with a resolvable
# archive host. 116 was live and unarchived when this was pinned.
# Moving this is a deliberate act: bump `ensembl_release` with it, and
# expect every cached sequence to be re-fetched (the release is in the
# cache key). `src/core/ensembl_release.py` is the authority on all of it.
ensembl_base_url: "https://sep2025.rest.ensembl.org"
ensembl_release: 115
gnomad_api_url: "https://gnomad.broadinstitute.org/api"
ncbi_eutils_url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/"
ucsc_api_url: "https://api.genome.ucsc.edu/getData/track"
encode_portal_url: "https://www.encodeproject.org"

# --- API Rate Limits (requests/second) ---
api_rate_limits:
  ensembl: 15
  ncbi: 3
  ucsc: 5
  gnomad: 5

# --- Scoring Weights (must sum to 1.0) ---
scoring_weights:
  sequence_specificity: 0.20
  variant_toxicity: 0.15
  biophysics_structure: 0.25
  epigenetic_context: 0.20
  execution_safety: 0.20

# --- Risk Thresholds ---
risk_thresholds:
  safe: 0.3
  warning: 0.6
  high_risk: 0.8
  # ≥ 0.8 → DANGEROUS

# --- Supported Cell Lines ---
supported_cell_lines:
  - A549
  - GM12878
  - HEK293T
  - HeLa
  - HepG2
  - Huh7
  - K562
  - MCF7

# --- Local Data Paths ---
data_paths:
  epdnew_bed: "data/1_Temel_Harita/EPDnew/EPDnew_hg38.bed"
  fantom5_bed: "data/1_Temel_Harita/FANTOM5/FANTOM5_hg38_CAGE_peaks.bed"
  mirbase_fa: "data/1_Temel_Harita/miRBase/mature.fa"
  cosmic_vcf: "data/2_Varyant_Toksisite/COSMIC/Cosmic_GenomeScreensMutant_v103_GRCh38.vcf.gz"
  ccle_csv: "data/3_Topoloji_Epigenetik/CCLE/CCLE_Expression.csv"
  turner_rules_dir: "data/4_Biyofizik_Yapısal/Turner_Rules"
  shape_seq_dir: "data/4_Biyofizik_Yapısal/SHAPE_Seq"
  m6a_bed: "data/4_Biyofizik_Yapısal/RMBase/hg38_m6A_mühürlü.bed.gz"
  immune_motifs: "data/5_Icra_Güvenlik/Immun_Motifler/immune_motifs.txt"
  circrna_dir: "data/5_Icra_Güvenlik/circAtlas"
  rbp_dir: "data/5_Icra_Güvenlik/POSTAR3"
  cache_db: "data/cache/orcsonar_cache.db"

# --- Cache Settings ---
cache:
  default_ttl_hours: 168    # 1 week
  max_size_mb: 2048

# --- Output ---
results_dir: "results"
logs_dir: "logs"
