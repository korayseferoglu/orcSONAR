# orcSONAR – Cell Line ENCODE / GEO Experiment Registry
# All BigWig URLs point to ENCODE portal experiment accessions.
# hic_url → 4DN portal .hic files (open_data_url, S3 direct).
#
# Accession registry (validated 2026-05-09, full ENCODE search + pyBigWig open test):
#   - h3k*_chip:    Histone ChIP-seq, output_type "fold change over control"
#   - atac_seq:     ATAC-seq fold change over control, OR DNase-seq
#                   "read-depth normalized signal" fallback (HeLa, HEK293T)
#   - ago2_eclip:   eCLIP target=AGO2, "fold change over control" (HepG2)
#                   or "plus strand signal of unique reads" (K562)
#   - hnrnpa1_eclip: eCLIP target=HNRNPA1, "plus strand signal of unique reads"
#   - gro_seq_plus_url / gro_seq_minus_url:
#       Strand-specific nascent transcription BigWigs.  We use, in order of
#       preference: PRO-seq (A549) → PRO-cap (K562, HEK293T) →
#       GRO-cap (GM12878) → CAGE (HeLa-S3, HepG2, MCF-7).  CAGE is a 5'
#       nascent-TSS proxy and is the closest available substitute for cell
#       lines without GRO-seq/PRO-seq on ENCODE.
#   - gro_seq_url:  Optional unstranded fallback.  When both plus and minus
#       are null but gro_seq_url is set, transcription_run.py reads it as a
#       single combined signal.  Currently null everywhere — left for future
#       cell lines without strand-resolved data.
#   - hic_url:      4DN portal in-situ Hi-C (or Dilution Hi-C for A549).
#       URLs are open_data_url S3 paths so hicstraw can stream without auth.
#
# Coverage notes:
#   - eCLIP: AGO2/hnRNPA1 only available for K562 and HepG2 in ENCODE.
#     Other cell lines: framework returns 0.0 (neutral) for null entry.
#   - HEK293T h3k27me3: not available in ENCODE.
#   - Huh7: no ENCODE BigWig coverage at all — pipeline returns neutral
#     scores for all epigenetic/safety domains for this cell line.
#   - GRO-seq: ENCODE has no HeLa GRO/PRO-seq, so HeLa-S3 CAGE is used.
#     Huh-7 has no nascent-transcription data on ENCODE → null.
#   - Hi-C: 4DN has no in-situ Hi-C for HEK293T, MCF-7, Huh-7 → null.
#
# pyBigWig requirement: HTTP 307 redirect resolution is handled in
# src/stage4_epigenetic/encode_reader.py (libBigWig does not follow redirects).

