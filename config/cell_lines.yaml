# hic_url → 4DN portal .hic files.
#
# h3k27me3_chip: repressive Polycomb mark.  Fill in the ENCODE accession from
# https://www.encodeproject.org after filtering for:
#   Assay: Histone ChIP-seq  |  Target: H3K27me3  |  Biosample: <cell line>
#   File format: bigWig  |  Output type: signal fold change over control
# Framework returns 0.0 (neutral) for any null entry.

