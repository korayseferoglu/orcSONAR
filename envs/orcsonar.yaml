name: orcsonar
# This mirrors the tested pip environment (Python 3.12) exactly so that
# `conda env create -f envs/orcsonar.yaml` reproduces the same package set as a
# plain `pip install -e .`. Only packages imported at runtime are listed.
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip
  - pip:
      # Workflow
      - snakemake==9.19.0
      # Bioinformatics / genomics I/O
      - pysam==0.23.3
      - pyBigWig==0.3.25
      - hic-straw==1.3.1
      # HTTP / retry
      - requests==2.33.1
      - tenacity==9.1.4
      # Data
      - pandas==3.0.2
      # CLI
      - tqdm==4.67.3
      # Reporting
      - jinja2==3.1.6
      - weasyprint==68.1
      # Config / logging
      - pydantic==2.13.3
      - pydantic-settings==2.14.0
      - pyyaml==6.0.3
      - loguru==0.7.3
      # Dev / testing
      - pytest==9.0.3
      - pytest-cov==7.1.0
      - responses==0.26.0
      - ruff>=0.6
      - mypy>=1.11
      - types-requests>=2.31
      - types-PyYAML>=6.0
