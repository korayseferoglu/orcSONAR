name: orcsonar
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  # Bioinformatics (prefer conda builds for C-extension libraries)
  - bioconda::pysam>=0.22
  - bioconda::bedtools>=2.31
  - bioconda::snakemake>=8.0
  - pip:biopython>=1.83
  # Data science
  - numpy>=1.26
  - pandas>=2.2
  - scipy>=1.12
  - scikit-learn>=1.4
  # Pip-only packages
  - pip:
    - pyBigWig>=0.3.22
    - pybedtools>=0.10
    - hic-straw>=1.3
    - polars>=1.0
    - requests>=2.31
    - aiohttp>=3.9
    - tenacity>=8.2
    - jinja2>=3.1
    - weasyprint>=62
    - plotly>=5.18
    - pydantic>=2.6
    - pydantic-settings>=2.2
    - pyyaml>=6.0
    - loguru>=0.7
    # Dev / testing
    - pytest>=8.0
    - pytest-cov
    - responses
    - ruff
    - mypy
    - types-requests
    - types-PyYAML
