name: CI

# Roadmap H6. This file is built against the two ways a CI stops being a gate:
#
#   * it goes red on a tree that did not change — so every pin lives in
#     pyproject's `dev` extra, exactly (`ruff==`, not `ruff>=`), and nothing
#     here installs a linter on its own,
#   * it goes green on everything — so ruff and pytest fail the job, and only
#     mypy is allowed not to (72 errors today, roadmap B10).
#
# `tests/hooks/test_ci_workflow.py` pins each of those decisions, and it runs
# in this workflow, so the file and its rules cannot drift apart in a merge.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # A real repository, not an export: tests/hooks read file modes out of
      # the git index. Measured — the same tests against a `git archive`
      # tarball fail 8 times, against a clean clone they pass.
      - name: Checkout
        uses: actions/checkout@v4

      # 3.12 is the interpreter the suite is measured green on (1019 passed).
      # `requires-python` claims >= 3.11, which nothing has measured.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # hic-straw 1.3.1 publishes only a macOS cp39 wheel, so Linux always
      # builds it from source and that build links against libcurl. pyBigWig
      # and pysam do have cp312 manylinux wheels and need nothing here.
      - name: System libraries for the hic-straw source build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev zlib1g-dev

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: ruff (blocking)
        # Scope authority is `_status.RUFF_SCOPE`, pinned by
        # tests/hooks/test_ci_workflow.py. `tests/` joined the gate on
        # 2026-11-19, once H14 and H15 had closed all 50 findings it carried.
        run: python -m ruff check src .claude/hooks tests

      - name: pytest (blocking)
        # -rs lists what was skipped. `data/` is not in the repository, so ~71
        # data-dependent tests do not run here; a gate that skips 7% of the
        # suite should say which 7% in its own log.
        run: python -m pytest -q -rs

      - name: single-copy gate (blocking)
        # Roadmap H9. A canonical fact stated outside its authority starts to
        # drift, and the copy that drifts is the one that stops protecting
        # anything: a wrong `0.5` had reached five files here and one of them
        # had quietly disabled a QA gate.
        #
        # Blocking on purpose, and it needs no install: the gate is stdlib
        # plus pyyaml, which the dev extra already pins.
        run: python .claude/hooks/check-single-copy.py

      - name: roadmap order gate (blocking)
        # Roadmap H9b. Order is read from file position alone; a row whose
        # prose claims a different order writes "what comes next" twice in the
        # same authority file, and the copy the machine reads wins silently.
        # That happened on 2026-11-26: H7's row pointed at H9 while next-fix
        # returned H7.
        run: bash .claude/acceptance/H9b.sh

      - name: mypy (informational)
        continue-on-error: true
        run: python -m mypy src/
