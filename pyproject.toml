[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orcsonar"
version = "0.1.0"
description = "Cell-specific saRNA off-target predictor"
requires-python = ">=3.11"
# Versions are pinned to the tested environment (Python 3.12) to keep installs
# reproducible. Only packages that are actually imported at runtime are listed;
# see envs/orcsonar.yaml for the conda equivalent.
dependencies = [
    # Workflow (invoked as `python -m snakemake`, not imported)
    "snakemake==9.19.0",
    # Bioinformatics / genomics I/O
    "pysam==0.23.3",
    "pyBigWig==0.3.25",
    "hic-straw==1.3.1",
    # HTTP / retry
    "requests==2.33.1",
    "tenacity==9.1.4",
    # Data
    "pandas==3.0.2",
    # CLI
    "tqdm==4.67.3",
    # Reporting
    "jinja2==3.1.6",
    "weasyprint==68.1",
    # Config / logging
    "pydantic==2.13.3",
    "pydantic-settings==2.14.0",
    "pyyaml==6.0.3",
    "loguru==0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "responses==0.26.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.31",
    "types-PyYAML>=6.0",
]

[project.scripts]
orcsonar = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
