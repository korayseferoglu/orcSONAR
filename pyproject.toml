[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "orcsonar"
version = "0.1.0"
description = "Cell-specific saRNA off-target predictor"
requires-python = ">=3.11"
dependencies = [
    # Bioinformatics
    "snakemake>=8.0",
    "pysam>=0.22",
    "pybedtools>=0.10",
    "pyBigWig>=0.3.22",
    "biopython>=1.83",
    "hic-straw>=1.3",
    # HTTP / async
    "requests>=2.31",
    "aiohttp>=3.9",
    "tenacity>=8.2",
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "polars>=1.0",
    # ML / stats
    "scikit-learn>=1.4",
    "scipy>=1.12",
    # Reporting
    "jinja2>=3.1",
    "weasyprint>=62",
    "plotly>=5.18",
    # Config / logging
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "responses",
    "ruff",
    "mypy",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
orcsonar = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
